[project]
name = "pyrpc-codegen"
version = "0.11.1"
description = "Codegen and CLI tools for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.0",
    "jsonschema-ts>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_codegen"]
