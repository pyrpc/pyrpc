[project]
name = "pyrpc-django-adapter"
version = "0.9.0"
description = "Django adapter for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "pyrpc-core>=0.7.7",
    "django>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_django"]
