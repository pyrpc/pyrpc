[project]
name = "pyrpc-fastapi"
version = "0.7.6"
description = "FastAPI adapter for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "pyrpc-core>=0.7.6",
    "fastapi>=0.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_fastapi"]
