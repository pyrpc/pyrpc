[project]
name = "pyrpc-cli"
version = "0.1.0-alpha.1"
description = "CLI and dev tools for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "pyrpc-codegen",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "uvicorn>=0.23.0",
    "httpx>=0.28.1",
    "watchfiles>=1.0.0",
]

[project.scripts]
pyrpc = "pyrpc_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_cli"]
