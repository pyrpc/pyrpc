[project]
name = "pyrpc-flask"
version = "0.1.0"
description = "Flask adapter for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "pyrpc-server",
    "flask>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_flask"]
