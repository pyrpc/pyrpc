[project]
name = "pyrpc-flask"
version = "0.3.3"
description = "Flask adapter for pyRPC"
requires-python = ">=3.11"
dependencies = [
    "pyrpc-core[flask]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_flask"]
