[project]
name = "pyrpc-core"
version = "0.10.1"
description = "pyRPC Core - tRPC-style RPC protocol and runtime for Python"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "anyio>=4.0",
    "pyrpc-codegen>=0.10.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "uvicorn>=0.23.0",
    "watchfiles>=1.0.0",
    "questionary>=2.0.0",
    "jsonc-edit>=0.1.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "pyrpc-fastapi"]
flask = ["flask>=3.0.0", "pyrpc-flask"]
django = ["django>=4.2.0", "pyrpc-django-adapter"]

[project.scripts]
pyrpc = "pyrpc_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrpc_core"]
