        - breaking
    - title: Features
      labels:
        - feat
    - title: Fixes
      labels:
        - fix
    - title: TypeScript Client
      labels:
        - client
        - types
    - title: Adapters
      labels:
        - adapter
        - fastapi
        - flask
        - django
        - react
        - next
        - vue
        - svelte
    - title: Codegen
      labels:
        - codegen
    - title: Documentation
      labels:
        - docs
    - title: Internal / Tooling
      labels:
        - chore
        - ci
        - test
        - refactor
    - title: Dependency Updates
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
