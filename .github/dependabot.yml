version: 2

updates:
  # Python workspace + dev group (uv.lock)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  # npm workspaces (packages/*) — package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-packages-minor-and-patch:
        update-types:
          - minor
          - patch

  # Docs site dependencies
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
