name: Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  # Python across OS x version. Path handling, file watchers, and
  # process management are environment-dependent, so Windows and macOS
  # run the suite too. The gate job below preserves the plain
  # "test-python" check-run name that branch protection requires.
  test-python-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

  # Aggregate gate so the required check name stays "test-python"
  # regardless of how the matrix expands.
  test-python:
    needs: test-python-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Pass only if every matrix leg passed
        run: |
          result='${{ toJSON(needs.test-python-matrix.result) }}'
          echo "matrix result: $result"
          if [ "$result" != '"success"' ]; then
            echo "One or more matrix legs failed or were cancelled."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: >
          uv run pytest
          --cov=pyrpc_core --cov=pyrpc_codegen
          --cov=pyrpc_fastapi --cov=pyrpc_flask --cov=pyrpc_django
          --cov-report=term-missing --cov-fail-under=78

  typecheck-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run mypy
        run: uv run mypy

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

  examples-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install example-only dependencies
        run: uv pip install flask-cors django-cors-headers

      - name: Verify every example's Python side
        run: uv run python scripts/verify_examples.py

  docs-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install dependencies used by documented snippets
        run: uv pip install flask-cors django-cors-headers

      - name: Verify docs code blocks
        run: uv run python scripts/check_docs_code.py

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build workspace dependencies
        run: npm run build --workspace=@pyrpc/client --workspace=@pyrpc/react

      - name: Run tests
        run: npm run test --workspaces

      - name: Typecheck packages
        run: npm run typecheck --workspaces --if-present

      - name: ESLint packages
        run: npm run lint:packages

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix docs

      - name: Run ESLint
        run: npm run lint --prefix docs
