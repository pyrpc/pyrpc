name: Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build python packages
        run: |
          mkdir -p dist
          for pkg in pyrpc-codegen pyrpc-core pyrpc-fastapi pyrpc-flask pyrpc-django-adapter; do
            python -m build "packages/$pkg" --outdir dist/
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @pyrpc/types to npm
        working-directory: ./packages/types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          EXISTING=$(npm view @pyrpc/types@$VERSION version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "@pyrpc/types@$VERSION already published, skipping."
            exit 0
          fi
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            npm publish --access public --tag "$TAG"
          else
            npm publish --access public
          fi

  publish-npm-client:
    runs-on: ubuntu-latest
    needs: [publish-npm-types]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        run: |
          npm install
          npm run build --workspace=@pyrpc/client

      - name: Publish @pyrpc/client
        working-directory: ./packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTING=$(npm view @pyrpc/client@$VERSION version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "@pyrpc/client@$VERSION already published, skipping."
            exit 0
          fi
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            npm publish --access public --tag "$TAG"
          else
            npm publish --access public
          fi

  publish-npm-react:
    runs-on: ubuntu-latest
    needs: [publish-npm-client]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build
        run: |
          npm install
          npm run build --workspace=@pyrpc/client
          npm run build --workspace=@pyrpc/react

      - name: Publish @pyrpc/react
        working-directory: ./packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXISTING=$(npm view @pyrpc/react@$VERSION version 2>/dev/null || echo "")
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "@pyrpc/react@$VERSION already published, skipping."
            exit 0
          fi
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            npm publish --access public --tag "$TAG"
          else
            npm publish --access public
          fi

  publish-npm-adapters:
    runs-on: ubuntu-latest
    needs: [publish-npm-react]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install and build adapters
        run: |
          npm install
          npm run build --workspace=@pyrpc/client
          npm run build --workspace=@pyrpc/react
          npm run build --workspace=@pyrpc/next
          npm run build --workspace=@pyrpc/vue
          npm run build --workspace=@pyrpc/svelte

      - name: Publish @pyrpc/next, vue, svelte
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in next vue svelte; do
            PKG_NAME="@pyrpc/$pkg"
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            EXISTING=$(npm view ${PKG_NAME}@${VERSION} version 2>/dev/null || echo "")
            if [ "$EXISTING" = "$VERSION" ]; then
              echo "${PKG_NAME}@${VERSION} already published, skipping."
              continue
            fi
            PUBLISH_ARGS="--access public"
            if [[ "$VERSION" == *"-"* ]]; then
              TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
              PUBLISH_ARGS="--access public --tag $TAG"
            fi
            (cd packages/$pkg && npm publish $PUBLISH_ARGS)
          done

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      [
        publish-pypi,
        publish-npm-types,
        publish-npm-client,
        publish-npm-react,
        publish-npm-adapters,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          name: pyRPC ${{ github.ref_name }}
