name: Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - 'canary'
          - 'next'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build python packages
        run: |
          mkdir -p dist
          for pkg in pyrpc-core pyrpc-codegen pyrpc-fastapi pyrpc-flask; do
            python -m build "packages/$pkg" --outdir "dist/$pkg"
            cp -r "dist/$pkg"/* dist/
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build TypeScript packages
        run: |
          cd packages/client
          npm ci
          npm run build

      - name: Publish @pyrpc/types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dist_tag || '' }}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ]; then
            npm publish ./packages/types --access public --tag "$TAG"
          elif echo "$VERSION" | grep -q '-'; then
            PRETAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            npm publish ./packages/types --access public --tag "$PRETAG"
          else
            npm publish ./packages/types --access public
          fi

      - name: Publish @pyrpc/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dist_tag || '' }}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ]; then
            npm publish ./packages/client --access public --tag "$TAG"
          elif echo "$VERSION" | grep -q '-'; then
            PRETAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            npm publish ./packages/client --access public --tag "$PRETAG"
          else
            npm publish ./packages/client --access public
          fi

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [publish-pypi, publish-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          name: pyRPC ${{ github.ref_name }}
