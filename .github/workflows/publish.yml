name: Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build python packages
        run: |
          mkdir -p dist
          for pkg in pyrpc-core pyrpc-codegen pyrpc-fastapi pyrpc-flask; do
            python -m build "packages/$pkg" --outdir dist/
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-npm-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @pyrpc/types to npm
        working-directory: ./packages/types
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            echo "Publishing prerelease with tag: $TAG"
            npm publish --access public --tag "$TAG"
          else
            echo "Publishing stable release"
            npm publish --access public
          fi

  publish-npm:
    runs-on: ubuntu-latest
    needs: [publish-npm-types]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        working-directory: ./packages/client
        run: npm install

      - name: Build TypeScript package
        working-directory: ./packages/client
        run: npm run build

      - name: Publish to npm
        working-directory: ./packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')
            echo "Publishing prerelease with tag: $TAG"
            npm publish --access public --tag "$TAG"
          else
            echo "Publishing stable release"
            npm publish --access public
          fi

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [publish-pypi, publish-npm-types, publish-npm]
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          name: pyRPC ${{ github.ref_name }}
