<svg width="100%" viewBox="0 0 880 400" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="880" height="400" rx="16" fill="#16161a"/>
  <text x="40" y="48" fill="#e6e6e0" font-size="18" font-weight="600">The link pipeline ends in exactly one terminator</text>
  <text x="40" y="70" fill="#9c9ca8" font-size="12">compose cross-cutting links; the last one owns the transport</text>

  <g font-size="12">
    <rect x="50" y="140" width="120" height="56" rx="10" fill="#222226"/>
    <text x="110" y="164" fill="#e6e6e0" text-anchor="middle">client.add</text>
    <text x="110" y="184" fill="#9c9ca8" text-anchor="middle">Operation</text>

    <path d="M170 168 H225" stroke="#4e8a68" stroke-width="1.5" marker-end="url(#i)"/>

    <rect x="230" y="140" width="150" height="56" rx="10" fill="#1d1d22" stroke="#3a3a46"/>
    <text x="305" y="164" fill="#c0c0ba" text-anchor="middle">authLink</text>
    <text x="305" y="184" fill="#9c9ca8" text-anchor="middle">(yours, optional)</text>

    <rect x="380" y="140" width="150" height="56" rx="10" fill="#1d1d22" stroke="#3a3a46"/>
    <text x="455" y="164" fill="#c0c0ba" text-anchor="middle">retryLink</text>
    <text x="455" y="184" fill="#9c9ca8" text-anchor="middle">(yours, optional)</text>

    <path d="M380 168 H365" stroke="#505060" stroke-width="1.5"/>
    <path d="M530 168 H585" stroke="#505060" stroke-width="1.5"/>

    <rect x="590" y="128" width="250 " height="80" rx="10" fill="#1d2b23" stroke="#4e8a68"/>
    <text x="715" y="156" fill="#6fb58d" text-anchor="middle" font-weight="600">terminating link</text>
    <text x="715" y="178" fill="#e6e6e0" text-anchor="middle">httpLink | httpBatchLink</text>
    <text x="715" y="198" fill="#9c9ca8" text-anchor="middle">owns fetch()</text>
  </g>

  <path d="M715 208 V250" stroke="#505060" stroke-width="1.5" marker-end="url(#j)"/>

  <g font-size="12">
    <rect x="240" y="255" width="180" height="52" rx="8" fill="#222226"/>
    <text x="330" y="277" fill="#e6e6e0" text-anchor="middle">POST /rpc</text>
    <text x="330" y="296" fill="#9c9ca8" text-anchor="middle">&#123; op &#125; or [ ops ]</text>

    <rect x="470" y="255" width="200" height="52" rx="8" fill="#222226"/>
    <text x="570" y="277" fill="#e6e6e0" text-anchor="middle">OperationResult</text>
    <text x="570" y="296" fill="#9c9ca8" text-anchor="middle">typed from Python</text>
  </g>

  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4e8a68"/>
    </marker>
    <marker id="j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#505060"/>
    </marker>
  </defs>
</svg>
