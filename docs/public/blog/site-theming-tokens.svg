<svg width="100%" viewBox="0 0 880 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="880" height="300" rx="16" fill="#16161a"/>
  <text x="40" y="48" fill="#e6e6e0" font-size="18" font-weight="600">One palette, every surface</text>
  <text x="40" y="70" fill="#9c9ca8" font-size="12">shared Shiki themes render code identically across the site</text>

  <!-- palette -->
  <g>
    <rect x="60" y="105" width="70" height="46" rx="8" fill="#111113"/><text x="95" y="172" fill="#9c9ca8" font-size="10" text-anchor="middle">#111113</text>
    <rect x="145" y="105" width="70" height="46" rx="8" fill="#222226"/><text x="180" y="172" fill="#9c9ca8" font-size="10" text-anchor="middle">#222226</text>
    <rect x="230" y="105" width="70" height="46" rx="8" fill="#3a3a46"/><text x="265" y="172" fill="#9c9ca8" font-size="10" text-anchor="middle">#3a3a46</text>
    <rect x="315" y="105" width="70" height="46" rx="8" fill="#4e8a68"/><text x="350" y="172" fill="#9c9ca8" font-size="10" text-anchor="middle">#4e8a68</text>
    <rect x="400" y="105" width="70" height="46" rx="8" fill="#e6e6e0"/><text x="435" y="172" fill="#9c9ca8" font-size="10" text-anchor="middle">#e6e6e0</text>
  </g>

  <path d="M470 128 H520" stroke="#505060" stroke-width="1.5" marker-end="url(#k)"/>

  <!-- surfaces -->
  <g font-size="12">
    <rect x="525" y="98" width="100" height="34" rx="7" fill="#222226"/><text x="575" y="119" fill="#e6e6e0" text-anchor="middle">landing</text>
    <rect x="635" y="98" width="100" height="34" rx="7" fill="#222226"/><text x="685" y="119" fill="#e6e6e0" text-anchor="middle">docs</text>
    <rect x="745" y="98" width="100" height="34" rx="7" fill="#222226"/><text x="795" y="119" fill="#e6e6e0" text-anchor="middle">playground</text>

    <rect x="525" y="142" width="320" height="30" rx="7" fill="#1d1d22"/>
    <text x="540" y="161" fill="#6fb58d">@rpc.query</text><text x="650" y="161" fill="#c0c0ba">def add(a: int) -&gt; int: ...</text>
    <rect x="525" y="180" width="320" height="30" rx="7" fill="#1d1d22"/>
    <text x="540" y="199" fill="#d89c9c">// dark theme</text><text x="660" y="199" fill="#c0c0ba">same tokens as light</text>
  </g>

  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#505060"/>
    </marker>
  </defs>
</svg>
