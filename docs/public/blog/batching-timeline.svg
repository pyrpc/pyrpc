<svg width="100%" viewBox="0 0 880 420" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="880" height="420" rx="16" fill="#16161a"/>
  <text x="40" y="48" fill="#e6e6e0" font-size="18" font-weight="600">Same scheduling window, one request</text>
  <text x="40" y="70" fill="#9c9ca8" font-size="12">httpBatchLink coalesces operations issued in the same tick</text>

  <!-- timeline -->
  <line x1="60" y1="120" x2="820" y2="120" stroke="#3a3a46" stroke-width="1.5"/>
  <circle cx="90" cy="120" r="5" fill="#4e8a68"/><text x="90" y="105" fill="#9c9ca8" font-size="11" text-anchor="middle">tick 0</text>
  <circle cx="230" cy="120" r="5" fill="#4e8a68"/>
  <circle cx="330" cy="120" r="5" fill="#4e8a68"/>
  <circle cx="430" cy="120" r="5" fill="#4e8a68"/>
  <circle cx="700" cy="120" r="5" fill="#505060"/><text x="700" y="105" fill="#9c9ca8" font-size="11" text-anchor="middle">setTimeout(0)</text>

  <!-- ops -->
  <g font-size="12">
    <rect x="60" y="145" width="150" height="30" rx="6" fill="#222226"/><text x="135" y="165" fill="#e6e6e0" text-anchor="middle">add(1, 2)</text>
    <rect x="225" y="145" width="150" height="30" rx="6" fill="#222226"/><text x="300" y="165" text-anchor="middle" fill="#e6e6e0">greet("Ada")</text>
    <rect x="390" y="145" width="160" height="30" rx="6" fill="#222226"/><text x="470" y="165" text-anchor="middle" fill="#e6e6e0">list_items()</text>
  </g>

  <!-- coalesce arrow down to single post -->
  <path d="M300 185 V225" stroke="#4e8a68" stroke-width="1.5"/>
  <rect x="180" y="228" width="480" height="44" rx="8" fill="#1d2b23" stroke="#4e8a68"/>
  <text x="420" y="255" fill="#6fb58d" font-size="13" text-anchor="middle" font-weight="600">POST /rpc   [ op1, op2, op3 ]</text>

  <!-- responses -->
  <path d="M420 272 V305" stroke="#505060" stroke-width="1.5" marker-end="url(#b)"/>
  <g font-size="12">
    <rect x="120" y="315" width="200" height="56" rx="8" fill="#222226"/>
    <text x="220" y="338" fill="#e6e6e0" text-anchor="middle">res[0] -&gt; add</text>
    <text x="220" y="358" fill="#9c9ca8" text-anchor="middle">resolve(op1)</text>

    <rect x="340" y="315" width="200" height="56" rx="8" fill="#222226"/>
    <text x="440" y="338" fill="#e6e6e0" text-anchor="middle">res[1] -&gt; greet</text>
    <text x="440" y="358" fill="#9c9ca8" text-anchor="middle">resolve(op2)</text>

    <rect x="560" y="315" width="200" height="56" rx="8" fill="#222226"/>
    <text x="660" y="338" fill="#e6e6e0" text-anchor="middle">res[2] -&gt; error?</text>
    <text x="660" y="358" fill="#9c9ca8" text-anchor="middle">rejects op3 only</text>
  </g>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#505060"/>
    </marker>
  </defs>
</svg>
