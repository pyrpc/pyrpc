<svg width="100%" viewBox="0 0 880 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect x="0" y="0" width="880" height="430" rx="16" fill="#16161a"/>
  <text x="40" y="48" fill="#e6e6e0" font-size="18" font-weight="600">One backend section, four frameworks</text>
  <text x="40" y="70" fill="#9c9ca8" font-size="12">backend.framework decides which native dev server runs</text>

  <!-- config -->
  <rect x="40" y="100" width="250" height="150" rx="10" fill="#222226"/>
  <text x="60" y="128" fill="#9c9ca8" font-size="11">pyrpc.json</text>
  <text x="60" y="152" fill="#6fb58d" font-size="12">"backend": &#123;</text>
  <text x="72" y="172" fill="#e6e6e0" font-size="12">"framework": "..."</text>
  <text x="72" y="192" fill="#e6e6e0" font-size="12">"entrypoint": "..."</text>
  <text x="72" y="212" fill="#e6e6e0" font-size="12">"types_module": "..."</text>
  <text x="60" y="232" fill="#6fb58d" font-size="12">&#125;</text>

  <path d="M290 175 H350" stroke="#505060" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- dispatcher -->
  <rect x="355" y="140" width="130" height="70" rx="10" fill="#1d2b23" stroke="#4e8a68"/>
  <text x="420" y="170" fill="#6fb58d" font-size="12" text-anchor="middle" font-weight="600">resolve_launch</text>
  <text x="420" y="192" fill="#9c9ca8" font-size="11" text-anchor="middle">runners.py</text>

  <!-- three branches -->
  <path d="M485 155 C520 155 520 115 555 115" stroke="#505060" fill="none" stroke-width="1.5"/>
  <path d="M485 175 H555" stroke="#505060" stroke-width="1.5"/>
  <path d="M485 195 C520 195 520 235 555 235" stroke="#505060" fill="none" stroke-width="1.5"/>

  <g font-size="12">
    <rect x="560" y="92" width="280" height="52" rx="8" fill="#222226"/>
    <text x="578" y="114" fill="#e6e6e0">fastapi / asgi</text>
    <text x="578" y="133" fill="#9c9ca8">$ python -m uvicorn main:app</text>

    <rect x="560" y="156" width="280" height="52" rx="8" fill="#222226"/>
    <text x="578" y="178" fill="#e6e6e0">flask</text>
    <text x="578" y="197" fill="#9c9ca8">$ flask --app main:app run</text>

    <rect x="560" y="220" width="280" height="52" rx="8" fill="#222226"/>
    <text x="578" y="242" fill="#e6e6e0">django</text>
    <text x="578" y="261" fill="#9c9ca8">$ manage.py runserver 127.0.0.1:8000</text>
  </g>

  <!-- note -->
  <rect x="40" y="320" width="800" height="66" rx="10" fill="#1d1d22"/>
  <text x="64" y="348" fill="#c0c0ba" font-size="12">No WSGI-to-ASGI bridge. Each server is the framework's own, launched in its own working directory.</text>
  <text x="64" y="370" fill="#9c9ca8" font-size="12">Reload flags map per runner: --reload / --noreload where supported.</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#505060"/>
    </marker>
  </defs>
</svg>
